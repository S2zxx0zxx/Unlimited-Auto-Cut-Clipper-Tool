[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveclip-zero-smart"
version = "2.1.0"
description = "Local livestream recorder and heuristic highlight candidate detector"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
keywords = ["livestream", "clips", "ffmpeg", "highlights", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = ["streamlink>=8.0,<9.0"]

[project.scripts]
liveclip-zero = "liveclip.cli:main"
liveclip-zero-gui = "liveclip.gui:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

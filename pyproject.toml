[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveclip-zero-smart"
version = "2.5.0"
description = "LiveClip Zero Studio: local recording, highlights and vertical video editing"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
keywords = ["livestream", "clips", "ffmpeg", "highlights", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = ["streamlink>=8.0,<9.0", "rich>=13.9,<15"]

[project.scripts]
liveclip-zero = "liveclip.cli:main"
liveclip-zero-gui = "liveclip.gui:main"
liveclip-web = "liveclip.web_studio:main"
liveclip-studio = "liveclip.neon_adopt.cli:main"
liveclip-neon = "liveclip.neon_adopt.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
neon = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]
speech = ["faster-whisper>=1.2,<2"]
download = ["yt-dlp>=2025.1"]
gta = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5", "onnxruntime>=1.18,<2"]
all = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5", "faster-whisper>=1.2,<2", "yt-dlp>=2025.1", "onnxruntime>=1.18,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
